<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotify Callback</title>
  </head>
  <body>
    <p>Returning to Shortcuts…</p>

    <script>
      // Full URL contains ?code=...&state=...
      const fullUrl = window.location.href;

      // Forward into Shortcuts, passing the full URL as Shortcuts input text=
      const target =
        "shortcuts://run-shortcut?name=SpotifyCallback&input=text&text=" +
        encodeURIComponent(fullUrl);

      window.location.replace(target);
    </script>
  </body>
</html>
