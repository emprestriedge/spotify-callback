<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotify Callback</title>
  </head>
  <body>
    <p>Returning to Shortcuts…</p>
    <p>If nothing happens, tap the button below.</p>

    <button id="go">Open Shortcuts</button>

    <script>
      // Full URL contains ?code=...&state=...
      const fullUrl = window.location.href;

      // IMPORTANT: use x-callback-url form (more consistent)
      const target =
        "shortcuts://x-callback-url/run-shortcut" +
        "?name=SpotifyCallback" +
        "&input=text" +
        "&text=" + encodeURIComponent(fullUrl);

      // Try auto-forward (may be blocked/stripped by Safari sometimes)
      setTimeout(() => {
        window.location.href = target;
      }, 150);

      // Guaranteed fallback via user gesture
      document.getElementById("go").addEventListener("click", () => {
        window.location.href = target;
      });
    </script>
  </body>
</html>
